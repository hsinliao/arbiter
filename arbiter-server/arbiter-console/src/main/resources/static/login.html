<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>登录 - Arbiter Console</title>
    <link rel="stylesheet" href="/assets/console.css">
</head>
<body class="login-page">
<main class="login-card">
    <h1>Arbiter Console</h1>
    <p>登录以管理服务与用户。</p>

    <form id="loginForm">
        <div class="field">
            <label for="username">用户名</label>
            <input id="username" name="username" autocomplete="username"
                   required autofocus>
        </div>
        <div class="field">
            <label for="password">密码</label>
            <input id="password" name="password" type="password"
                   autocomplete="current-password" required>
        </div>
        <button class="button" type="submit" id="loginButton">登录</button>
        <p class="form-error" id="loginError" role="alert" hidden></p>
    </form>
</main>

<script src="/assets/console.js"></script>
<script>
    document.addEventListener('DOMContentLoaded', () => {
        if (ArbiterConsole.token() && ArbiterConsole.currentUser()) {
            location.replace('/home.html');
            return;
        }

        const form = document.getElementById('loginForm');
        const button = document.getElementById('loginButton');
        const error = document.getElementById('loginError');

        form.addEventListener('submit', async event => {
            event.preventDefault();
            error.hidden = true;
            button.disabled = true;
            try {
                await ArbiterConsole.login(
                    document.getElementById('username').value.trim(),
                    document.getElementById('password').value
                );
                location.replace('/home.html');
            } catch (failure) {
                ArbiterConsole.showError(error, failure);
                button.disabled = false;
            }
        });
    });
</script>
</body>
</html>
