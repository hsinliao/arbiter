# Client (CLI) configuration.
#
# Loaded from <arbiter.home>/conf/cli.properties on every CLI start, after the
# shared conf/common.properties and before the user config
# (~/.config/arbiter/config) and the project .arbiterrc, both of which override
# these values. Do not store credentials here.
#
# arbiter.transport and arbiter.api.prefix live in conf/common.properties.
# The client host defaults to arbiter.server.host; set arbiter.client.host to
# connect to a different address while keeping the shared port.
# arbiter.client.host=127.0.0.1
# arbiter.client.connect.timeout.ms=3000
# arbiter.client.read.timeout.ms=10000
# arbiter.client.pool.acquire.timeout.ms=2000
# arbiter.client.pool.permits=4
# arbiter.client.retry.max=2
# arbiter.client.retry.base.delay.ms=150
#
# TLS/mTLS (requires an https:// server URL). Passwords are environment-only:
# ARBITER_TLS_TRUSTSTORE_PASSWORD and ARBITER_TLS_KEYSTORE_PASSWORD.
# arbiter.client.tls.enabled=true
# arbiter.client.tls.truststore=/path/to/client-trust.p12
# arbiter.client.tls.truststore.type=PKCS12
# arbiter.client.tls.keystore=/path/to/client.p12
# arbiter.client.tls.keystore.type=PKCS12
