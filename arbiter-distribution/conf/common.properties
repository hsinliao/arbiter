# Settings shared by the CLI and the server.
#
# Both processes load this file before their own configuration file
# (conf/cli.properties or conf/server.properties), which override these values.
# All keys use the arbiter. prefix.
#
# arbiter.server.host and arbiter.server.port are the server bind address and
# the CLI connect address. arbiter.transport may be http, unix, or both; with
# both, the CLI uses HTTP and the server also opens the Unix-domain socket at
# <arbiter.home>/run/server.sock.
#
# arbiter.server.host=127.0.0.1
# arbiter.server.port=8080
# arbiter.transport=http
# arbiter.api.prefix=/api/v1
