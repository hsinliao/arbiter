# Server configuration.
#
# The server reads this file plus conf/common.properties; it reads no
# environment variables. Keep this file readable only by the service account
# because it contains TLS passwords.
# All keys use the arbiter. prefix.
#
# Shared settings (arbiter.server.host, arbiter.server.port,
# arbiter.transport, arbiter.api.prefix) live in conf/common.properties.
#
# Users are encrypted in conf/security/users.dat using a subkey derived from
# conf/security/crypto.key. When users.dat is missing, the first start creates
# an admin user with a random password and writes the password once to
# conf/security/initial-admin.txt. Token signing uses a different
# purpose-specific subkey.
#
# arbiter.server.token.ttl.seconds=3600
# arbiter.server.max.request.bytes=65536
# arbiter.server.login.max.failures=5
# arbiter.server.login.window.seconds=60
#
# Console robot assistant (disabled by default). The API key is a server
# secret and must not be placed in the browser, common.properties, or logs.
# arbiter.agent.enabled=false
# arbiter.agent.base-url=https://api.openai.com/v1
# arbiter.agent.api-key=change-me
# arbiter.agent.model=your-model
# arbiter.agent.system-prompt=You are Arbiter Assistant. Use read-only tools and cite evidence.
# arbiter.agent.max-iterations=6
# arbiter.agent.max-total-tokens=20000
# arbiter.agent.max-cost=0
# arbiter.agent.timeout=60s
# arbiter.agent.tool-groups=system,reader,docs,admin
# arbiter.agent.temperature=0.2
# arbiter.agent.max-output-tokens=1200
# arbiter.agent.max-concurrent-runs=2
# arbiter.agent.max-runs-per-minute=12
# arbiter.agent.daily-token-budget=100000
# arbiter.agent.queue-capacity=16
# arbiter.agent.history-messages=20
# arbiter.agent.max-request-chars=8000
# arbiter.agent.run-retention=1h
# arbiter.agent.conversation-retention=8h
# Local default: durable H2 database under <arbiter.home>/data.
# arbiter.agent.storage-jdbc-url=jdbc:h2:file:${arbiter.home}/data/agent;AUTO_SERVER=TRUE;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE
# arbiter.agent.storage-username=sa
# arbiter.agent.storage-password=
# Multi-instance production example:
# arbiter.agent.storage-jdbc-url=jdbc:postgresql://db.example:5432/arbiter
# arbiter.agent.storage-username=arbiter
# arbiter.agent.storage-password=change-me
#
# TLS/mTLS: key store and trust store are fixed at
#   <arbiter.home>/conf/security/keystore.p12
#   <arbiter.home>/conf/security/truststore.p12
# arbiter.server.tls.enabled=false
# arbiter.server.tls.keystore.type=PKCS12
# arbiter.server.tls.keystore.password=changeit
# arbiter.server.tls.client.auth=false
# arbiter.server.tls.truststore.type=PKCS12
# arbiter.server.tls.truststore.password=changeit
# arbiter.server.tls.protocols=TLSv1.3,TLSv1.2
